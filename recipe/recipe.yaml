schema_version: 1

context:
  name: dlhub-sdk
  version: 2.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/DLHub-Argonne/dlhub_sdk/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d20d2f653f543ee7b344e5c64c78835ef496faa41ef71975e388babef0ad9cf3

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - globus-sdk <4,>=3
    - requests >=2.24.0
    - mdf_toolbox >=0.5.4
    - jsonschema >=3.2.0
    - globus-compute-sdk >=2.0.0
    - pydantic <2
    - numpy
    - pygithub
    - setuptools <80

tests:
  - python:
      imports:
        - dlhub_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python interface and utilities for DLHub
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/DLHub-Argonne/dlhub_sdk

extra:
  recipe-maintainers:
    - WardLT
    - jan-janssen
